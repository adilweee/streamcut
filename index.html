<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamCut AI - Masaüstü Editörünü İndir</title>
    <style>
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff4b4b, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #9ca3af;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .download-btn {
            background: linear-gradient(135deg, #ff4b4b 0%, #8b5cf6 100%);
            color: white;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(255, 75, 75, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>StreamCut AI</h1>
        <p>Yayınlarınızı yapay zeka gücüyle kesin, düzenleyin ve parlatın. Profesyonel masaüstü deneyimi şimdi hazır!
        </p>

        <!-- BURAYA KOPYALADIĞIN STANDART GOOGLE DRIVE LINKINI YAPIŞTIR -->
        <a href="https://drive.google.com/drive/folders/1aVlirh8r5ppQRtvtiaaAqtR73lx704tz?usp=sharing" target="_blank"
            class="download-btn">Google Drive Üzerinden
            İndir</a>
    </div>
</body>

</html>
