<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamCut AI - Web Video Editörü</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 550px;
            padding: 40px 30px;
            background: #1a1a24;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #2a2a3a;
            display: flex;
            flex-direction: column;
            gap: 20px; /* Elemanların arasına temiz boşluk bırakır */
        }
        h1 {
            font-size: 2.8rem;
            margin: 0;
            background: linear-gradient(45deg, #ff4b4b, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        p.subtitle {
            color: #9ca3af;
            margin: 0 0 10px 0;
            font-size: 1.05rem;
            line-height: 1.5;
        }
        .upload-area {
            border: 2px dashed #a855f7;
            padding: 40px 20px;
            border-radius: 16px;
            cursor: pointer;
            background: #13131a;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .upload-area:hover {
            border-color: #ff4b4b;
            background: #1c1c28;
            transform: scale(1.01);
        }
        .upload-area svg {
            transition: transform 0.3s ease;
        }
        .upload-area:hover svg {
            transform: translateY(-5px);
        }
        .file-msg {
            margin: 0;
            font-size: 1rem;
            color: #9ca3af;
            font-weight: 500;
        }
        .btn {
            background: linear-gradient(135deg, #ff4b4b 0%, #8b5cf6 100%);
            color: white;
            padding: 16px 30px;
            font-size: 1.15rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 75, 75, 0.3);
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
        }
        .btn:active {
            transform: translateY(0);
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>StreamCut AI</h1>
        <p class="subtitle">Videonuzu seçin ve yapay zeka destekli kesme işlemini doğrudan tarayıcınızda başlatın!</p>
        
        <label for="video-input" class="upload-area">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <p id="file-name" class="file-msg">Bir video dosyası sürükleyin veya seçin</p>
        </label>
        <input type="file" id="video-input" accept="video/*">
        
        <button class="btn" onclick="videoyuKes()">Videonun Boşluklarını Kes</button>
    </div>

    <script>
        const videoInput = document.getElementById('video-input');
        const fileName = document.getElementById('file-name');

        videoInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                fileName.innerText = "Seçilen: " + e.target.files[0].name;
                fileName.style.color = '#ff4b4b';
            }
        });

        function videoyuKes() {
            if(videoInput.files.length === 0) {
                alert("Lütfen önce bir video dosyası seçin Adil!");
                return;
            }
            alert("Arayüz artık kusursuz! Sıra kodları canlandırmakta.");
        }
    </script>
</body>
</html>
